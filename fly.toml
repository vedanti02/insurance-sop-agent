# Fly.io: `fly launch --no-deploy` (accept this file), `fly secrets set LLM_API_KEY=sk-...`, `fly deploy`.
app = "insurance-sop-agent"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_MODE = "live"
  PERCEIVE_MODEL = "gpt-4.1-mini"
  RESPOND_MODEL = "gpt-4.1"
  DEMO_TODAY = "2026-03-01"
  CONSENT_SCENARIO = "default"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
