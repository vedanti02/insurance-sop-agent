services:
  agent:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ./fixtures:/app/fixtures:ro
      - ./verticals:/app/verticals:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
